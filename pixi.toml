[workspace]
name = "cpacs-schema-tool"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
channel-priority = "strict"

[dependencies]
python = ">=3.10,<3.14"
lxml = ">=5,<7"
tomli = ">=2,<3"
pytest = ">=8,<9"
pytest-cov = ">=5,<7"
ruff = ">=0.12,<1"
pip = "*"

[pypi-dependencies]
cpacs-schema-tool = { path = ".", editable = true }

[tasks]
test = "python -m pytest"
lint = "ruff check src tests"
format = "ruff format src tests"
check = { depends-on = ["lint", "test"] }
