[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpacs-schema-tool"
version = "0.1.1"
description = "Formatter, checker, linter, and migration tool for CPACS XML Schemas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "German Aerospace Center (DLR), Institute of System Architectures in Aeronautics" }
]
keywords = ["CPACS", "XML Schema", "XSD", "formatter", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=5,<7",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
cpacs-schema = "cpacs_schema_tool.cli:main"

[project.urls]
Repository = "https://github.com/DLR-SL/cpacs-schema-tool"
Issues = "https://github.com/DLR-SL/cpacs-schema-tool/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpacs_schema_tool = ["resources/*.toml", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
